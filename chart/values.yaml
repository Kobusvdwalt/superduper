# Which deployment this is: acc or prd. Names the vault key prefix.
env: dev
# Public host for the web app (/) and the API (/api). Required.
ingress_host: ""

# Per-app image versions. Each release pins them in chart_deployment/<env>.
image_repository: ghcr.io/tiental/superduper
version_api: latest
version_web: latest
image_pull_secrets: []

# ClusterSecretStore for this namespace's Key Vault; Duplo names it
# namespace-vault-<aks resource>-<namespace>.
secret_store_name: ""

# Key Vault secret names. The Postgres password is generated by the Duplo postgres
# passwordUsers declaration and copied into the namespace vault as
# <postgres resource>-<user>-password. The other two are set by hand; empty means
# <env>-superduper-better-auth-secret and <env>-superduper-owner-email.
postgres_password_ref: postgres-superduper-password
better_auth_secret_ref: ""
owner_email_ref: ""

pghost: ""
pgport: "5432"
pgdatabase: superduper
pgusername: superduper
pgsslmode: verify-full
# Shared server: keep the pool well under the server's max_connections.
database_pool_max: 5

# Better Auth's base URL; empty means https://<ingress_host>.
better_auth_url: ""
# Extra origins allowed to call auth endpoints with credentials (comma-separated).
auth_trusted_origins: ""
log_level: info

resources:
  api:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  web:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }
