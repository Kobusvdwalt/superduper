apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      protocol: TCP
      port: 4400
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Migrations run at startup under an advisory lock, so a rolling update is safe.
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      {{- include "superduper.podSecurity" . | nindent 6 }}
      containers:
        - name: api
          image: "{{ .Values.image_repository }}/api:{{ .Values.version_api }}"
          {{- include "superduper.containerSecurity" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 4400
          # Migrations run before the server listens, so the startup probe covers them.
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          env:
            - name: API_PORT
              value: "4400"
            - name: LOG_LEVEL
              value: {{ .Values.log_level | quote }}
            - name: DATABASE_POOL_MAX
              value: {{ .Values.database_pool_max | quote }}
            - name: BETTER_AUTH_URL
              value: {{ include "superduper.betterAuthUrl" . | quote }}
            - name: AUTH_TRUSTED_ORIGINS
              value: {{ .Values.auth_trusted_origins | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superduper
                  key: database-url
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: superduper
                  key: better-auth-secret
            - name: OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: superduper
                  key: owner-email
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
