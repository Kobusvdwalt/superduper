{{- $prefix := printf "%s-superduper" .Values.env -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: superduper
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ include "superduper.secretStore" . | quote }}
  target:
    name: superduper
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-url: {{ printf "postgres://%s:%s@%s:%s/%s?sslmode=%s" .Values.pgusername "{{ .postgresPassword | trim | urlquery }}" (required "pghost is required" .Values.pghost) .Values.pgport .Values.pgdatabase .Values.pgsslmode | quote }}
        better-auth-secret: "{{ "{{ .betterAuthSecret | trim }}" }}"
        owner-email: "{{ "{{ .ownerEmail | trim | lower }}" }}"
  data:
    - secretKey: postgresPassword
      remoteRef:
        key: {{ .Values.postgres_password_ref | quote }}
    - secretKey: betterAuthSecret
      remoteRef:
        key: {{ .Values.better_auth_secret_ref | default (printf "%s-better-auth-secret" $prefix) | quote }}
    - secretKey: ownerEmail
      remoteRef:
        key: {{ .Values.owner_email_ref | default (printf "%s-owner-email" $prefix) | quote }}
