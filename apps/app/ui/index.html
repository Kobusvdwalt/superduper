<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super Duper</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
        --primary: #171717;
        --primary-fg: #fafafa;
        --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #262626;
          --primary: #fafafa;
          --primary-fg: #171717;
          --danger: #f87171;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 420px; display: grid; gap: 16px; }
      h1 { font-size: 1.25rem; font-weight: 600; }
      p { font-size: 0.875rem; color: var(--muted); line-height: 1.4; }
      form { display: grid; gap: 8px; }
      label { font-size: 0.875rem; font-weight: 500; }
      input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        height: 40px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button[type="submit"] { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
      #error { color: var(--danger); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Super Duper</h1>
      <section id="connecting" hidden>
        <p>Connecting to <span id="connecting-url"></span>&hellip;</p>
      </section>
      <section id="setup" hidden>
        <p id="reason"></p>
      </section>
      <form id="form" hidden>
        <label for="url">Server URL</label>
        <input id="url" name="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="https://superduper.example.com" required />
        <p id="hint"></p>
        <p id="error" role="alert" hidden></p>
        <div class="row">
          <button type="submit">Connect</button>
          <button id="retry" type="button" hidden>Retry</button>
          <button id="reset" type="button" hidden>Use default</button>
        </div>
      </form>
    </main>
    <script src="main.js"></script>
  </body>
</html>
