[package]
name = "superduper-app"
version = "0.1.0"
description = "Super Duper app shell"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "superduper_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tauri-plugin-health = { path = "../plugins/tauri-plugin-health" }
