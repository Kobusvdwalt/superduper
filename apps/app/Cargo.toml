[workspace]
resolver = "2"
members = ["src-tauri", "plugins/tauri-plugin-health"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin = { version = "2.6.3", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
