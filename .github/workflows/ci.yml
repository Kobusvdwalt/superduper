name: CI

on:
  pull_request:
  push:
    branches: [main]
  # deploy.yml starts this on its release branch: GitHub does not run pull_request
  # workflows for pull requests a workflow opened.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # apps/app (Rust + Android) is checked by app.yml, only when it or the contracts change.
      - run: bun run check:ci
