name: App

on:
  pull_request:
    paths:
      - "apps/app/**"
      - "contracts/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "contracts/**"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # cargo fmt, clippy -D warnings, cargo test, then the plugin's JVM unit tests (serialisers
      # against contracts/health-connect/v1, sync queue). Uses the runner's preinstalled Android SDK.
      - run: sh apps/app/scripts/check.sh
