name: App

on:
  pull_request:
    paths:
      - "apps/app/**"
      - "contracts/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "contracts/**"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Not named `check`: that name is the required status check on main, reported by ci.yml.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/app -> target
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Also save from pull requests; most app runs happen there.
          cache-read-only: false
      # cargo fmt, clippy -D warnings, cargo test, then the plugin's JVM unit tests (serialisers
      # against contracts/health-connect/v1, sync queue). Uses the runner's preinstalled Android SDK.
      - run: sh apps/app/scripts/check.sh
      - name: Summarise JVM tests
        if: always()
        run: |
          results=apps/app/plugins/tauri-plugin-health/android/build/test-results/testDebugUnitTest
          grep -h '<testsuite ' "$results"/TEST-*.xml | sed -E 's/.*name="([^"]+)" tests="([0-9]+)" skipped="([0-9]+)" failures="([0-9]+)" errors="([0-9]+)".*/\1: \2 tests, \3 skipped, \4 failed, \5 errors/'
          grep -q 'testcase name="matchesContractFixtures"' "$results"/TEST-*.xml
