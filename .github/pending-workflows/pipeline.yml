# Keep app-specific behavior in .github/project-config.yaml and app scripts.
# Change shared behavior in Tiental/workflows, then update this copy.

name: Pipeline
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # daily sweep of stale previews
  workflow_dispatch: {}
concurrency:
  # Label changes, closes and sweeps get their own groups, so they never cancel a run checking code.
  group: >-
    pipeline-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'schedule' && 'sweep'
      || github.event.action == 'closed' && 'closed'
      || (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('{0}-{1}', github.event.action, github.event.label.name)
      || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.action != 'unlabeled' }}
permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: write
  id-token: write
jobs:
  # Keep application work in project-config.yaml and the app scripts.
  pipeline:
    uses: Tiental/workflows/.github/workflows/pipeline.yml@v3.0.0
    secrets: inherit
